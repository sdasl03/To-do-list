<div class="row">
  <div class="d-flex justify-content-center">
    <form
      class="w-75 mx-auto p-md-5"
      #authForm="ngForm"
      (ngSubmit)="onSubmit(authForm)"
    >
      <div class="form-group mb-3">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" ngModel required email class="form-control" />
      </div>
      <div class="form-group mb-3">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          ngModel
          class="form-control"
          required
        />
      </div>
      <div>
        <button
          class="btn btn-outline-primary"
          type="submit"
          [disabled]="!authForm.valid"
        >
          {{ signMode() }}
        </button>
        <button class="btn btn-outline-secondary ms-2" type="button" (click)="onSwitchSignupState()">
          Switch to {{ oppositeSignMode() }}
        </button>
      </div>
    </form>
  </div>
</div>
